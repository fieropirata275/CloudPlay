# Control plane: API + Postgres + Redis + MinIO (partidas guardadas) + coturn + Caddy (TLS + cliente web)
# Uso: cp .env.example .env && docker compose up -d --build
services:
  caddy:
    image: caddy:2.8
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      CP_DOMAIN: ${CP_DOMAIN}
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./clients/web:/srv/web:ro
      - caddy_data:/data
    depends_on: [api]

  api:
    build: ./control-plane
    restart: unless-stopped
    env_file: .env
    environment:
      CP_DATABASE_URL: postgresql+asyncpg://cloudplay:${POSTGRES_PASSWORD}@postgres:5432/cloudplay
      CP_REDIS_URL: redis://redis:6379/0
      CP_PUBLIC_URL: https://${CP_DOMAIN}
      CP_STUN_URLS: stun:${CP_DOMAIN}:3478
      CP_TURN_URLS: turn:${CP_DOMAIN}:3478?transport=udp,turn:${CP_DOMAIN}:3478?transport=tcp,turns:${CP_DOMAIN}:5349?transport=tcp
      CP_TURN_SECRET: ${TURN_SECRET}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: cloudplay
      POSTGRES_USER: cloudplay
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: [pg_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudplay"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    # Los workers suben/bajan partidas aquí. Expón solo hacia la red de los workers (VPN/LAN).
    ports: ["${S3_BIND:-127.0.0.1}:9000:9000"]
    volumes: [minio_data:/data]

  coturn:
    image: coturn/coturn:4.6
    restart: unless-stopped
    network_mode: host   # rango UDP de relay sin NAT de Docker
    volumes:
      - ./deploy/coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
    command:
      - -c
      - /etc/coturn/turnserver.conf
      - --static-auth-secret=${TURN_SECRET}
      - --realm=${CP_DOMAIN}
      - --external-ip=${PUBLIC_IP}

volumes:
  caddy_data:
  pg_data:
  minio_data:
