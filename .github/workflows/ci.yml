# Pruebas en cada push: API, scripts de despliegue, chart de Helm y JS de las teles.
name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Tests de la API
        run: |
          pip install -q -r control-plane/requirements.txt aiosqlite fakeredis pytest httpx
          cd control-plane && python -m pytest -q tests
      - name: Shellcheck de los scripts de despliegue
        run: |
          sudo apt-get install -y -qq shellcheck
          shellcheck -S warning deploy/get.sh deploy/install/install.sh deploy/install/cloudplay deploy/install/continue.sh \
            deploy/install/ups/cloudplay-ups deploy/iso/build-iso.sh deploy/iso/firstboot.sh deploy/proxmox/cloudplay-pve.sh tests/proxmox/test_cluster.sh \
            deploy/install/cloudflare.sh deploy/install/mail.sh tests/cloudflare/test_cloudflare_mail.sh \
            deploy/branding/apply.sh
      - uses: azure/setup-helm@v4
      - name: Chart de Helm
        run: helm lint deploy/helm/cloudplay --set cloudflared.token=x
      - name: Puente HID del Wiimote (sesión)
        run: python -m pytest -q worker/session/tests/test_hidbridge.py
      - name: libhidapi de CloudPlay compila sin avisos
        run: gcc -O2 -Wall -Wextra -Werror -shared -fPIC -fvisibility=hidden -o /tmp/libhidapi-hidraw.so.0 worker/session/hidshim/hidshim.c
      - name: libpcap de CloudPlay (adaptador de red de PS2) compila sin avisos
        run: gcc -O2 -Wall -Wextra -Werror -shared -fPIC -fvisibility=hidden -Wl,-soname,libpcap.so.0.8 -o /tmp/libpcap.so.0.8 worker/session/hidshim/lanpcap.c
      - name: Animación de arranque de las consolas (Xvfb + GStreamer de verdad)
        run: |
          sudo apt-get install -y -qq xvfb gstreamer1.0-tools gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            gstreamer1.0-x gir1.2-gstreamer-1.0 gir1.2-gst-plugins-base-1.0 python3-gi >/dev/null
          /usr/bin/python3 worker/session/tests/test_bootsplash.py | tee /tmp/boot.log
          grep -q BOOTSPLASH_OK /tmp/boot.log
      - name: Clúster de Proxmox en un comando (qm/pvesh/pvesm simulados)
        run: bash tests/proxmox/test_cluster.sh | tail -n 3
      - name: cloudplay cloudflare y cloudplay mail (Cloudflare y Resend simulados + API real)
        run: bash tests/cloudflare/test_cloudflare_mail.sh | tail -n 2
      - name: Caddy en modo dominio y en modo red local (por IP)
        run: |
          docker run --rm -e CP_SITE=play.example.com -v "$PWD/deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2.8 \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
          docker run --rm -e CP_SITE=:80 -e CP_LAN_TLS_SITE=https://192.168.1.50 -e CP_AUTO_HTTPS=disable_redirects \
            -v "$PWD/deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2.8 caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: LOCAL LAN MODE de extremo a extremo (hub + DHCP + ARP + aislamiento de salas)
        run: python tests/lan/run_lan.py
      - name: Mandos (perfiles, hat y asistente con mandos simulados)
        run: node tests/web/pads.test.js
      - name: El cliente web sigue siendo ES5 (teles antiguas)
        run: |
          npm i -s --no-save acorn@8
          node -e "const a=require('acorn'),fs=require('fs');for(const f of fs.readdirSync('clients/web/js'))a.parse(fs.readFileSync('clients/web/js/'+f,'utf8'),{ecmaVersion:5});console.log('ES5 ok')"
