# Al crear una etiqueta vX.Y.Z: compila las 4 imágenes, las publica en GHCR (públicas y gratis)
# y crea la Release con el paquete, sus SHA256 y el instalador universal get.sh.
#   git tag v1.0.0 && git push origin v1.0.0
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Versión (vX.Y.Z)"
        required: true

permissions:
  contents: write
  packages: write

env:
  VERSION: ${{ github.event.inputs.version || github.ref_name }}

jobs:
  images:
    name: Imagen ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: control-plane, context: control-plane, file: control-plane/Dockerfile }
          - { name: agent, context: worker/agent, file: worker/agent/Dockerfile }
          - { name: session, context: worker/session, file: worker/session/Dockerfile }
          - { name: web, context: ., file: deploy/docker/web.Dockerfile }
    steps:
      - uses: actions/checkout@v4
      - name: Espacio en disco (la imagen de sesión compila emuladores)
        if: matrix.name == 'session'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - uses: actions/setup-node@v4
        if: matrix.name == 'web'
        with: { node-version: "22", cache: npm, cache-dependency-path: landing/package-lock.json }
      - name: Compilar la landing (export estático que sirve la imagen web)
        if: matrix.name == 'web'
        run: cd landing && npm ci --no-audit --no-fund && npm run build || { echo "::warning::landing sin compilar"; mkdir -p out; }
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Nombre de la imagen
        id: img
        run: echo "ref=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/cloudplay-${{ matrix.name }}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.img.outputs.ref }}:${{ env.VERSION }}
            ${{ steps.img.outputs.ref }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.title=cloudplay-${{ matrix.name }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  release:
    name: Release
    needs: images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Paquete, SHA256 e instalador
        run: |
          mkdir -p dist
          echo "$VERSION" > VERSION
          echo "$GITHUB_REPOSITORY" > RELEASE
          tar --exclude=./.git --exclude=./dist --exclude=./landing/node_modules -czf dist/cloudplay.tar.gz .
          sed "s#^REPO=.*#REPO=\"\${CLOUDPLAY_REPO:-$GITHUB_REPOSITORY}\"#" deploy/get.sh > dist/get.sh
          (cd dist && sha256sum cloudplay.tar.gz get.sh > SHA256SUMS && cat SHA256SUMS)
      - name: Publicar la Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          cat > notes.md <<NOTES
          ## Instalar

          \`\`\`bash
          # Orquestador
          curl -fsSL https://github.com/$GITHUB_REPOSITORY/releases/latest/download/get.sh | sudo bash -s -- orchestrator --domain play.empresa.com
          # Nodo gaming
          curl -fsSL https://github.com/$GITHUB_REPOSITORY/releases/latest/download/get.sh | sudo bash -s -- node --cp-url https://play.empresa.com --join-token TOKEN
          \`\`\`

          Imágenes: \`ghcr.io/$OWNER/cloudplay-{control-plane,agent,session,web}:$VERSION\` · Guía: [docs/DEPLOY.md](https://github.com/$GITHUB_REPOSITORY/blob/$VERSION/docs/DEPLOY.md)
          NOTES
          gh release create "$VERSION" dist/cloudplay.tar.gz dist/get.sh dist/SHA256SUMS \
            --title "CloudPlay $VERSION" --notes-file notes.md --target "$GITHUB_SHA" \
            || gh release upload "$VERSION" dist/cloudplay.tar.gz dist/get.sh dist/SHA256SUMS --clobber
