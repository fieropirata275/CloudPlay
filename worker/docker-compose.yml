# Nodo gaming. Requisitos en el host: Docker, módulo uinput cargado y
# nvidia-container-toolkit (GPU=nvidia) o /dev/dri (GPU=vaapi). El instalador lo deja todo listo:
#   curl -fsSL https://play.example.com/install/node.sh | sudo bash -s -- --join-token TOKEN
# A mano:
#   docker build -t cloudplay/session:local ./session
#   cp worker.env.example worker.env && docker compose up -d --build
services:
  agent:
    build: ./agent
    image: ${CLOUDPLAY_IMAGES:-cloudplay/}agent:${CLOUDPLAY_TAG:-local}
    # Tras un apagón vuelve solo y adopta las partidas que sigan vivas
    restart: always
    env_file: worker.env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Misma ruta dentro y fuera: el agente crea carpetas que luego monta en contenedores hermanos
      - ${DATA_DIR:-/var/lib/cloudplay}:${DATA_DIR:-/var/lib/cloudplay}
      # Solo lectura para escanear el catálogo
      - ${LIBRARY_DIR:-/srv/cloudplay/library}:/library:ro
      # Firmware (BIOS PS2, IPL GameCube, NAND Wii): con él aparece en el catálogo la consola sin juego
      - ${BIOS_DIR:-/srv/cloudplay/bios}:/bios:ro
