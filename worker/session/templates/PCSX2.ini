; Plantilla de PCSX2 (v2.x). @VARS@ las rellena setup-emu.sh.
; Si cambias algo, lo más fácil es configurarlo una vez en la GUI y copiar las claves aquí.
[UI]
SettingsVersion = 1
SetupWizardIncomplete = false
ConfirmShutdown = false
StartFullscreen = true
HideMouseCursor = true
DoubleClickTogglesFullscreen = false

[Folders]
Bios = /bios/ps2
MemoryCards = /saves/ps2/memcards
Savestates = /saves/ps2/sstates
Snapshots = /tmp/snaps

[Filenames]
BIOS = @PS2_BIOS@

[EmuCore]
EnableDiscordPresence = false
EnableFastBoot = true

[EmuCore/GS]
; 12 = OpenGL (lo intercepta VirtualGL). Vulkan no pasa por VirtualGL.
Renderer = 12
upscale_multiplier = @UPSCALE@
VsyncEnable = 0
OsdShowFPS = false

[SPU2/Output]
Backend = Cubeb
DriverName = pulse
OutputLatency = 20
OutputLatencyMinimal = true

[InputSources]
SDL = true
SDLControllerEnhancedMode = false
Keyboard = true
Mouse = false

[Pad1]
Type = DualShock2
Up = SDL-0/DPadUp
Right = SDL-0/DPadRight
Down = SDL-0/DPadDown
Left = SDL-0/DPadLeft
Triangle = SDL-0/FaceNorth
Circle = SDL-0/FaceEast
Cross = SDL-0/FaceSouth
Square = SDL-0/FaceWest
Select = SDL-0/Back
Start = SDL-0/Start
L1 = SDL-0/LeftShoulder
L2 = SDL-0/+LeftTrigger
R1 = SDL-0/RightShoulder
R2 = SDL-0/+RightTrigger
L3 = SDL-0/LeftStick
R3 = SDL-0/RightStick
LUp = SDL-0/-LeftY
LRight = SDL-0/+LeftX
LDown = SDL-0/+LeftY
LLeft = SDL-0/-LeftX
RUp = SDL-0/-RightY
RRight = SDL-0/+RightX
RDown = SDL-0/+RightY
RLeft = SDL-0/-RightX
Analog = SDL-0/Guide
LargeMotor = SDL-0/LargeMotor
SmallMotor = SDL-0/SmallMotor

[Pad2]
Type = DualShock2
Up = SDL-1/DPadUp
Right = SDL-1/DPadRight
Down = SDL-1/DPadDown
Left = SDL-1/DPadLeft
Triangle = SDL-1/FaceNorth
Circle = SDL-1/FaceEast
Cross = SDL-1/FaceSouth
Square = SDL-1/FaceWest
Select = SDL-1/Back
Start = SDL-1/Start
L1 = SDL-1/LeftShoulder
L2 = SDL-1/+LeftTrigger
R1 = SDL-1/RightShoulder
R2 = SDL-1/+RightTrigger
L3 = SDL-1/LeftStick
R3 = SDL-1/RightStick
LUp = SDL-1/-LeftY
LRight = SDL-1/+LeftX
LDown = SDL-1/+LeftY
LLeft = SDL-1/-LeftX
RUp = SDL-1/-RightY
RRight = SDL-1/+RightX
RDown = SDL-1/+RightY
RLeft = SDL-1/-RightX

[Hotkeys]
SaveStateToSlot = Keyboard/F1
CycleSaveStateSlot = Keyboard/F2
LoadStateFromSlot = Keyboard/F3
Screenshot = Keyboard/F8
ToggleTurbo = Keyboard/Tab
