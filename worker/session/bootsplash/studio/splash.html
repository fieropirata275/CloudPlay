<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>CloudPlay boot</title>
<!-- Animación de arranque "de firmware" de cada consola. render.mjs la pinta fotograma a fotograma:
     splash.html?platform=ps2|gc|wii  y window.frame(t) dibuja el instante t (segundos). -->
<style>
  @font-face { font-family: "Unbounded"; font-weight: 800; src: url(/clients/web/fonts/unbounded-latin-800-normal.woff2) format("woff2"); }
  @font-face { font-family: "Unbounded"; font-weight: 600; src: url(/clients/web/fonts/unbounded-latin-600-normal.woff2) format("woff2"); }
  html, body { margin: 0; width: 1280px; height: 720px; overflow: hidden; background: #000; }
  canvas { display: block; position: absolute; inset: 0; }
  #ui { position: absolute; inset: 0; pointer-events: none; }
  #word { position: absolute; left: 0; right: 0; top: 548px; text-align: center; font: 800 46px/1 "Unbounded", sans-serif;
          letter-spacing: 0.02em; color: #fff; opacity: 0; }
  #word span { display: inline-block; }
  #tag { position: absolute; left: 0; right: 0; top: 612px; text-align: center; font: 600 13px/1 "Unbounded", sans-serif;
         letter-spacing: 0.5em; text-transform: uppercase; opacity: 0; }
  #fade { position: absolute; inset: 0; background: #000; opacity: 1; }
</style>
<script type="importmap">{ "imports": {
  "three": "/worker/session/bootsplash/studio/node_modules/three/build/three.module.js",
  "three/addons/": "/worker/session/bootsplash/studio/node_modules/three/examples/jsm/" } }</script>
</head>
<body>
<div id="ui"><div id="word"></div><div id="tag"></div></div>
<div id="fade"></div>
<script type="module">
import * as THREE from 'three';
import { SVGLoader } from 'three/addons/loaders/SVGLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { MeshSurfaceSampler } from 'three/addons/math/MeshSurfaceSampler.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const W = 1280, H = 720;
const platform = new URLSearchParams(location.search).get('platform') || 'ps2';

// Siluetas de las consolas: las mismas que la pantalla de arranque del cliente (clients/web/js/fx.js)
const CLOUD = 'M52,140 C30,140 18,124 22,106 C25,92 38,84 52,86 C56,62 76,48 100,50 C124,52 140,70 142,90 C160,88 178,102 176,120 C174,134 162,140 150,140 Z';
const PLAY = 'M90,80 L124,101 L90,122 Z';
const SIL = {
  ps2: ['M68,28 L132,28 L132,94 L126,94 L126,106 L132,106 L132,172 L68,172 L68,106 L74,106 L74,94 L68,94 Z', 'M80,52 L120,52 M80,148 L120,148'],
  gc: ['M100,34 L156,64 L156,134 L100,166 L44,134 L44,64 Z', 'M100,34 L100,100 M44,64 L100,100 L156,64 M100,100 L100,166'],
  wii: ['M86,24 C86,16 114,16 114,24 L118,170 C118,182 82,182 82,170 Z', 'M100,48 L100,68 M90,58 L110,58']
};
// Cada consola, su metal
const LOOK = {
  ps2: { metal: 0x4466ff, rough: 0.2, bg0: '#0a1440', bg1: '#010208', glow: 0x6f9bff, text: '#cfe0ff', tag: 'system boot · ps2', exp: 1.15, env: 0.9 },
  gc: { metal: 0x8a66ff, rough: 0.18, bg0: '#1e0d4a', bg1: '#04020c', glow: 0xb39bff, text: '#e6dcff', tag: 'system boot · gamecube', exp: 1.15, env: 0.9 },
  wii: { metal: 0xb9c4cf, rough: 0.16, bg0: '#3c4a58', bg1: '#06080b', glow: 0x9fe6ff, text: '#ffffff', tag: 'system boot · wii', exp: 0.8, env: 0.6 }
}[platform];

// ---------------------------------------------------------------------------- utilidades de tiempo
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const easeOut = x => 1 - Math.pow(1 - x, 3);
const easeInOut = x => x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const easeIn = x => x * x * x;
let seed = 1337;
const rnd = () => ((seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296);
function hash3(x, y, z) { const s = Math.sin(x * 12.9898 + y * 78.233 + z * 37.719) * 43758.5453; return s - Math.floor(s); }
function vnoise(x, y, z) {  // value noise igual que la del shader
  const ix = Math.floor(x), iy = Math.floor(y), iz = Math.floor(z);
  const fx = x - ix, fy = y - iy, fz = z - iz;
  const u = fx * fx * (3 - 2 * fx), v = fy * fy * (3 - 2 * fy), w = fz * fz * (3 - 2 * fz);
  const L = (a, b, t) => a + (b - a) * t;
  const h = (a, b, c) => hash3(ix + a, iy + b, iz + c);
  return L(L(L(h(0,0,0), h(1,0,0), u), L(h(0,1,0), h(1,1,0), u), v), L(L(h(0,0,1), h(1,0,1), u), L(h(0,1,1), h(1,1,1), u), v), w);
}

// ---------------------------------------------------------------------------- escena
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(W, H);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = LOOK.exp;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
// Fondo: degradado radial del color de la consola
const bgc = document.createElement('canvas'); bgc.width = 512; bgc.height = 288;
{
  const g = bgc.getContext('2d');
  const grd = g.createRadialGradient(256, 130, 10, 256, 144, 330);
  grd.addColorStop(0, LOOK.bg0); grd.addColorStop(1, LOOK.bg1);
  g.fillStyle = grd; g.fillRect(0, 0, 512, 288);
}
const bgTex = new THREE.CanvasTexture(bgc); bgTex.colorSpace = THREE.SRGBColorSpace;
scene.background = new THREE.Color(0x000000);
const bgMesh = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), new THREE.ShaderMaterial({
  uniforms: { map: { value: bgTex }, k: { value: 0 } }, depthWrite: false, depthTest: false,
  vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 1.0, 1.0); }',
  fragmentShader: 'uniform sampler2D map; uniform float k; varying vec2 vUv; void main(){ gl_FragColor = vec4(texture2D(map, vUv).rgb * k, 1.0); }'
}));
bgMesh.renderOrder = -1; bgMesh.frustumCulled = false;
scene.add(bgMesh);

const pmrem = new THREE.PMREMGenerator(renderer);
// Estudio de fotografía oscuro con tiras de luz: lo que hace que el metal parezca metal (reflejos duros y negros)
function studio() {
  const s = new THREE.Scene();
  s.background = new THREE.Color(0x050608);
  const strip = (w, h, x, y, z, ry, k) => {
    const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ color: new THREE.Color(k, k, k), side: THREE.DoubleSide }));
    m.position.set(x, y, z); m.lookAt(0, 0, 0); m.rotateZ(ry); s.add(m);
  };
  strip(14, 1.4, 0, 6, 3, 0, 5);       // tira larga arriba
  strip(1.2, 9, -7, 0, 2, 0, 3.5);     // vertical a la izquierda
  strip(1.2, 9, 7.5, 0.5, -3, 0, 2.5); // contra a la derecha
  strip(6, 0.6, 0, -5, 4, 0.2, 1.6);   // reflejo bajo
  strip(12, 5, 0, 3, 10, 0, 0.9);      // softbox frontal (la cara del logo mira aquí)
  strip(0.8, 10, -4, 0, 9, 0, 4);      // barras que cruzan la cara al girar el entorno
  strip(0.5, 10, 5, 0, 8, 0, 3);
  return s;
}
const room = new RoomEnvironment();
const studioScene = studio();
studioScene.add(...room.children.filter(o => o.isLight));
scene.environment = pmrem.fromScene(studioScene, 0.02).texture;
scene.environmentIntensity = LOOK.env;

const camera = new THREE.PerspectiveCamera(30, W / H, 1, 2000);
camera.position.set(0, 18, 470);
camera.lookAt(0, 10, 0);

const key = new THREE.DirectionalLight(0xffffff, 2.2); key.position.set(-200, 260, 300); scene.add(key);
const rim = new THREE.PointLight(LOOK.glow, 0, 0, 0); rim.position.set(260, 60, -120); scene.add(rim);
const sweep = new THREE.PointLight(0xffffff, 0, 0, 0); scene.add(sweep);

// ---------------------------------------------------------------------------- el logo de metal
const svg = new SVGLoader().parse(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200"><path fill-rule="evenodd" d="${CLOUD} ${PLAY}"/></svg>`);
const shapes = svg.paths.flatMap(p => SVGLoader.createShapes(p));
const geo = new THREE.ExtrudeGeometry(shapes, { depth: 22, bevelEnabled: true, bevelThickness: 6, bevelSize: 4, bevelSegments: 10, curveSegments: 64 });
geo.center();
geo.scale(1.25, -1.25, 1.25);  // SVG va con la y hacia abajo
geo.computeVertexNormals();

const dissolve = { value: -0.2 };
const edgeCol = { value: new THREE.Color(LOOK.glow).multiplyScalar(2.4) };
const metal = new THREE.MeshPhysicalMaterial({
  color: LOOK.metal, metalness: 1, roughness: LOOK.rough, clearcoat: 1, clearcoatRoughness: 0.05,
  side: THREE.DoubleSide, envMapIntensity: 1.6
});
const NOISE_GLSL = `
  float h3(vec3 p){ float s = sin(p.x*12.9898 + p.y*78.233 + p.z*37.719)*43758.5453; return fract(s); }
  float vnoise(vec3 p){ vec3 i = floor(p); vec3 f = fract(p); vec3 u = f*f*(3.0-2.0*f);
    return mix(mix(mix(h3(i), h3(i+vec3(1,0,0)), u.x), mix(h3(i+vec3(0,1,0)), h3(i+vec3(1,1,0)), u.x), u.y),
               mix(mix(h3(i+vec3(0,0,1)), h3(i+vec3(1,0,1)), u.x), mix(h3(i+vec3(0,1,1)), h3(i+vec3(1,1,1)), u.x), u.y), u.z); }`;
// Valor de disolución de cada punto del logo: barrido diagonal + ruido (igual en JS para soltar las partículas ahí)
const dissolveField = (x, y, z) => 0.5 + (x * 0.8 + y * 0.35) / 260 + 0.32 * (vnoise(x / 26, y / 26, z / 26) - 0.5);
metal.onBeforeCompile = (sh) => {
  sh.uniforms.uDissolve = dissolve;
  sh.uniforms.uEdge = edgeCol;
  sh.vertexShader = sh.vertexShader.replace('#include <common>', '#include <common>\nvarying vec3 vObj;')
    .replace('#include <begin_vertex>', '#include <begin_vertex>\nvObj = position;');
  sh.fragmentShader = sh.fragmentShader.replace('#include <common>', `#include <common>\nvarying vec3 vObj;\nuniform float uDissolve;\nuniform vec3 uEdge;\n${NOISE_GLSL}`)
    .replace('#include <clipping_planes_fragment>', `#include <clipping_planes_fragment>
      float dfield = 0.5 + (vObj.x*0.8 + vObj.y*0.35)/260.0 + 0.32*(vnoise(vObj/26.0) - 0.5);
      float dd = dfield - uDissolve;
      if (dd < 0.0) discard;`)
    .replace('#include <emissivemap_fragment>', `#include <emissivemap_fragment>
      totalEmissiveRadiance += uEdge * (1.0 - smoothstep(0.0, 0.018, dd)) * step(-0.5, uDissolve);`);
};
const logo = new THREE.Group();
const logoMesh = new THREE.Mesh(geo, metal);
logo.add(logoMesh);
// El "play" del centro: un piloto que se enciende como el LED de la consola
// mismo sitio que el hueco: el logo extruido quedó centrado en la caja de la nube (geo.center())
const cloudBox = new THREE.Box2(); shapes[0].getPoints(64).forEach(p => cloudBox.expandByPoint(p));
const ctr = cloudBox.getCenter(new THREE.Vector2());
const tri = [[90, 80], [124, 101], [90, 122]], tc = [304 / 3, 101];
const ledPts = tri.map(([x, y]) => new THREE.Vector2(((tc[0] + 0.78 * (x - tc[0])) - ctr.x) * 1.25, -((tc[1] + 0.78 * (y - tc[1])) - ctr.y) * 1.25));
const ledGeo = new THREE.ShapeGeometry(new THREE.Shape(ledPts));
const ledMat = new THREE.MeshBasicMaterial({ color: new THREE.Color(LOOK.glow), transparent: true, opacity: 0, toneMapped: false, side: THREE.DoubleSide });
const led = new THREE.Mesh(ledGeo, ledMat);
logo.add(led);
scene.add(logo);

// ---------------------------------------------------------------------------- partículas
const N = 9000;
const sampler = new MeshSurfaceSampler(logoMesh).build();
const P0 = new Float32Array(N * 3), REL = new Float32Array(N), VEL = new Float32Array(N * 3), TGT = new Float32Array(N * 3), PH = new Float32Array(N);
{
  const v = new THREE.Vector3();
  for (let i = 0; i < N; i++) {
    sampler.sample(v);
    P0.set([v.x, v.y, v.z], i * 3);
    REL[i] = dissolveField(v.x, v.y, v.z);
    const a = rnd() * Math.PI * 2, s = 30 + rnd() * 70;
    VEL.set([Math.cos(a) * s * 0.6 + 45, Math.sin(a) * s * 0.6 + 30, (rnd() - 0.3) * s], i * 3);
    PH[i] = rnd();
  }
}
// Silueta de la consola: puntos repartidos por el contorno y los detalles
{
  const pts = [];
  for (const d of SIL[platform]) {
    const parsed = new SVGLoader().parse(`<svg xmlns="http://www.w3.org/2000/svg"><path d="${d}"/></svg>`);
    for (const p of parsed.paths) for (const sp of p.subPaths) {
      if (sp.autoClose) {  // la "Z" del trazo no entra en getSpacedPoints: se cierra a mano
        const a = sp.getPoint(1), b = sp.getPoint(0);
        if (a.distanceTo(b) > 0.5) sp.curves.push(new THREE.LineCurve(a, b));
        sp.autoClose = false; sp.cacheLengths = null; sp.needsUpdate = true;
      }
      const arr = sp.getSpacedPoints(Math.max(8, Math.round(sp.getLength() * 4)));  // densidad igual en todo el trazo
      for (const q of arr) pts.push(q);
    }
  }
  const L = pts.length;
  for (let i = 0; i < N; i++) {
    const q = pts[Math.floor(rnd() * L)];
    const j = (rnd() - 0.5) * 2.2;
    TGT.set([(q.x - 100) * 0.95 + j, -(q.y - 100) * 0.95 + j, (rnd() - 0.5) * 6], i * 3);
  }
}
const sprite = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const g = c.getContext('2d'); const gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(0.25, 'rgba(255,255,255,0.8)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 64, 64);
  return new THREE.CanvasTexture(c);
})();
const pgeo = new THREE.BufferGeometry();
const PP = new Float32Array(N * 3), PC = new Float32Array(N * 3);
pgeo.setAttribute('position', new THREE.BufferAttribute(PP, 3));
pgeo.setAttribute('color', new THREE.BufferAttribute(PC, 3));
const pmat = new THREE.PointsMaterial({ size: 3.2, map: sprite, vertexColors: true, transparent: true, depthWrite: false,
  blending: THREE.AdditiveBlending, toneMapped: false });
const points = new THREE.Points(pgeo, pmat);
points.frustumCulled = false;
scene.add(points);

// ---------------------------------------------------------------------------- posproceso
const composer = new EffectComposer(renderer);
composer.setPixelRatio(1);
composer.setSize(W, H);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(W, H), 0.5, 0.5, 0.9);
composer.addPass(bloom);
composer.addPass(new OutputPass());

// ---------------------------------------------------------------------------- texto
const word = document.getElementById('word'), tag = document.getElementById('tag'), fade = document.getElementById('fade');
word.innerHTML = [...'CloudPlay'].map(ch => `<span>${ch}</span>`).join('');
word.style.color = LOOK.text;
tag.style.color = LOOK.text;
tag.textContent = LOOK.tag;
const letters = [...word.children];

// ---------------------------------------------------------------------------- un fotograma
const DURATION = 5.2;
const glowCol = new THREE.Color(LOOK.glow), white = new THREE.Color(0xffffff), tmp = new THREE.Color();
const D0 = 3.05, D1 = 3.85;  // disolución
const G0 = 3.75, G1 = 4.35;  // las partículas forman la consola
const X0 = 4.6;              // y se van hacia la pantalla
function frame(t) {
  // pantalla: se enciende como una tele de tubo y se apaga al final
  fade.style.opacity = String(Math.max(1 - easeOut(seg(t, 0.05, 0.7)), easeIn(seg(t, 4.75, DURATION))));
  bgMesh.material.uniforms.k.value = 0.35 + 0.65 * easeOut(seg(t, 0.2, 1.4)) - 0.5 * seg(t, 3.6, 4.6);

  // logo: aparece girado, da la vuelta despacio con un barrido de luz
  const a = easeOut(seg(t, 0.15, 1.6));
  logo.scale.setScalar(0.86 + 0.14 * a);
  logo.position.y = 42 - 18 * (1 - a);
  logo.rotation.y = -1.05 * (1 - a) + 0.42 * easeInOut(seg(t, 0.8, 3.8)) - 0.21;
  logo.rotation.x = 0.12 * Math.sin(t * 0.9) - 0.1 * (1 - a);
  scene.environmentRotation.set(0, -1.4 + 2.2 * easeInOut(seg(t, 0.4, 3.4)), 0);
  const sw = seg(t, 1.5, 2.6);
  sweep.position.set(-420 + 840 * easeInOut(sw), 120, 220);
  sweep.intensity = 7 * Math.sin(Math.PI * sw);
  rim.intensity = 2.5 * easeOut(seg(t, 0.6, 1.8));
  ledMat.opacity = easeOut(seg(t, 1.85, 2.15)) * (1 - seg(t, D0, D0 + 0.35));
  ledMat.color.copy(glowCol).lerp(white, 0.25 * Math.max(0, 1 - Math.abs(t - 2.0) * 4)).multiplyScalar(1.6);
  dissolve.value = t < D0 ? -0.2 : -0.12 + 1.3 * easeIn(seg(t, D0, D1));

  // texto
  for (let i = 0; i < letters.length; i++) {
    const k = easeOut(seg(t, 1.25 + i * 0.05, 1.85 + i * 0.05));
    const out = easeIn(seg(t, D0 - 0.1 + i * 0.03, D0 + 0.45 + i * 0.03));
    letters[i].style.opacity = String(k * (1 - out));
    letters[i].style.transform = `translateY(${(1 - k) * 22 - out * 16}px)`;
    letters[i].style.filter = `blur(${(1 - k) * 6 + out * 8}px)`;
  }
  word.style.opacity = '1';
  tag.style.opacity = String(0.7 * easeOut(seg(t, 2.0, 2.6)) * (1 - seg(t, D0, D0 + 0.4)));
  tag.style.letterSpacing = (0.62 - 0.12 * easeOut(seg(t, 2.0, 3.0))) + 'em';

  // partículas
  logo.updateMatrixWorld(true);
  const m = logoMesh.matrixWorld, v = new THREE.Vector3();
  const lvl = dissolve.value;
  const gK = easeInOut(seg(t, G0, G1)), xK = easeIn(seg(t, X0, DURATION));
  for (let i = 0; i < N; i++) {
    // momento en que el borde de la disolución pasa por este punto del logo
    const relT = t < D0 ? 99 : D0 + Math.cbrt(clamp((REL[i] + 0.12) / 1.3)) * (D1 - D0);
    const age = t - relT;
    let alpha = 0;
    v.set(P0[i * 3], P0[i * 3 + 1], P0[i * 3 + 2]).applyMatrix4(m);
    if (age > 0) {
      const e = 1 - Math.exp(-age * 2.2);
      v.x += VEL[i * 3] * e + 10 * Math.sin(age * 3 + PH[i] * 6.28);
      v.y += VEL[i * 3 + 1] * e + 10 * Math.cos(age * 2.6 + PH[i] * 6.28);
      v.z += VEL[i * 3 + 2] * e;
      alpha = Math.min(1, age * 6);
    }
    if (gK > 0) {
      const tx = TGT[i * 3], ty = TGT[i * 3 + 1] + 30, tz = TGT[i * 3 + 2];
      v.x += (tx - v.x) * gK; v.y += (ty - v.y) * gK; v.z += (tz - v.z) * gK;
      alpha = Math.max(alpha, gK);
    }
    if (xK > 0) {
      v.x *= 1 + xK * 2.2; v.y = (v.y - 30) * (1 + xK * 2.2) + 30; v.z += xK * 520 * (0.6 + PH[i]);
      alpha *= 1 - xK;
    }
    PP[i * 3] = v.x; PP[i * 3 + 1] = v.y; PP[i * 3 + 2] = v.z;
    const twinkle = 0.65 + 0.35 * Math.sin(t * 9 + PH[i] * 40);
    tmp.copy(glowCol).lerp(white, 0.35 + 0.4 * gK * (PH[i] > 0.7 ? 1 : 0));
    const k = alpha * twinkle * (age > 0 && age < 0.25 ? 1.5 : 1) * (0.55 - 0.2 * gK);
    PC[i * 3] = tmp.r * k; PC[i * 3 + 1] = tmp.g * k; PC[i * 3 + 2] = tmp.b * k;
  }
  pgeo.attributes.position.needsUpdate = true;
  pgeo.attributes.color.needsUpdate = true;
  pmat.size = 3.0 + 0.6 * gK;
  bloom.strength = 0.5 + 0.35 * seg(t, D0, D1) + 0.15 * gK;
  composer.render();
}
window.DURATION = DURATION;
window.frame = frame;
await document.fonts.load('800 46px Unbounded');
await document.fonts.load('600 13px Unbounded');
frame(0);
window.ready = true;
</script>
</body>
</html>
