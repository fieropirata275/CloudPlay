# coturn con credenciales efímeras: el secreto y el realm se pasan por línea de comandos (docker-compose.yml)
listening-port=3478
tls-listening-port=5349
# cert=/etc/coturn/certs/fullchain.pem      # para turns:// monta los certs de Caddy/Let's Encrypt
# pkey=/etc/coturn/certs/privkey.pem

use-auth-secret
fingerprint
no-cli
no-multicast-peers
no-tlsv1
no-tlsv1_1

# Rango de puertos de relay (ábrelo en el firewall: UDP 49160-49400)
min-port=49160
max-port=49400

# No dejar que TURN se use para llegar a redes internas...
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
# ...excepto la subred de los workers si están en LAN privada (ajusta y descomenta):
# allowed-peer-ip=10.10.0.0-10.10.0.255

total-quota=200
stale-nonce=600
log-file=stdout
simple-log
