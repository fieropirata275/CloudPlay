{{- if not .Values.postgres.externalUrl }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "cp.name" . }}-postgres
  labels: {{- include "cp.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "cp.name" . }}-postgres
  replicas: 1
  selector:
    matchLabels: {{- include "cp.sel" (list $ "postgres") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "cp.sel" (list $ "postgres") | nindent 8 }}
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: postgres
          image: {{ .Values.images.postgres }}
          env:
            - { name: POSTGRES_DB, value: cloudplay }
            - { name: POSTGRES_USER, value: cloudplay }
            - { name: POSTGRES_PASSWORD, valueFrom: { secretKeyRef: { name: {{ include "cp.name" . }}, key: postgresPassword } } }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          ports: [{ name: pg, containerPort: 5432 }]
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "cloudplay"] }
            periodSeconds: 5
          volumeMounts: [{ name: data, mountPath: /var/lib/postgresql/data }]
          resources:
            requests: { cpu: 100m, memory: 256Mi }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.postgres.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources: { requests: { storage: {{ .Values.postgres.storage }} } }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "cp.name" . }}-postgres
  labels: {{- include "cp.labels" . | nindent 4 }}
spec:
  selector: {{- include "cp.sel" (list $ "postgres") | nindent 4 }}
  ports: [{ name: pg, port: 5432, targetPort: pg }]
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cp.name" . }}-redis
  labels: {{- include "cp.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels: {{- include "cp.sel" (list $ "redis") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "cp.sel" (list $ "redis") | nindent 8 }}
    spec:
      containers:
        - name: redis
          image: {{ .Values.images.redis }}
          # Solo mensajería en vivo y contadores: no necesita persistencia
          args: ["redis-server", "--save", "", "--appendonly", "no"]
          ports: [{ name: redis, containerPort: 6379 }]
          readinessProbe:
            exec: { command: ["redis-cli", "ping"] }
            periodSeconds: 5
          resources:
            requests: { cpu: 50m, memory: 64Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "cp.name" . }}-redis
  labels: {{- include "cp.labels" . | nindent 4 }}
spec:
  selector: {{- include "cp.sel" (list $ "redis") | nindent 4 }}
  ports: [{ name: redis, port: 6379, targetPort: redis }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "cp.name" . }}-s3
  labels: {{- include "cp.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "cp.name" . }}-s3
  replicas: 1
  selector:
    matchLabels: {{- include "cp.sel" (list $ "s3") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "cp.sel" (list $ "s3") | nindent 8 }}
    spec:
      containers:
        - name: seaweedfs
          image: {{ .Values.images.s3 }}
          env:
            - { name: S3_ACCESS_KEY, valueFrom: { secretKeyRef: { name: {{ include "cp.name" . }}, key: s3AccessKey } } }
            - { name: S3_SECRET_KEY, valueFrom: { secretKeyRef: { name: {{ include "cp.name" . }}, key: s3SecretKey } } }
          command: ["/bin/sh", "-c"]
          args:
            - >-
              printf '{"identities":[{"name":"cloudplay","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging"]}]}'
              "$S3_ACCESS_KEY" "$S3_SECRET_KEY" > /tmp/s3.json &&
              exec weed server -dir=/data -ip.bind=0.0.0.0 -master.volumeSizeLimitMB=1024 -volume.max=0
              -s3 -s3.port=8333 -s3.config=/tmp/s3.json
          ports: [{ name: s3, containerPort: 8333 }]
          readinessProbe:
            tcpSocket: { port: s3 }
            periodSeconds: 10
          volumeMounts: [{ name: data, mountPath: /data }]
          resources:
            requests: { cpu: 100m, memory: 256Mi }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.s3.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources: { requests: { storage: {{ .Values.s3.storage }} } }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "cp.name" . }}-s3
  labels: {{- include "cp.labels" . | nindent 4 }}
spec:
  selector: {{- include "cp.sel" (list $ "s3") | nindent 4 }}
  ports: [{ name: s3, port: 8333, targetPort: s3 }]
