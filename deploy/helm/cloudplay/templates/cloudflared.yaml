{{- if .Values.cloudflared.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cp.name" . }}-cloudflared
  labels: {{- include "cp.labels" . | nindent 4 }}
spec:
  # Varios conectores del mismo túnel: Cloudflare reparte y si uno cae (o su máquina) el resto sigue
  replicas: {{ .Values.cloudflared.replicas }}
  selector:
    matchLabels: {{- include "cp.sel" (list $ "cloudflared") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "cp.sel" (list $ "cloudflared") | nindent 8 }}
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {{- include "cp.sel" (list $ "cloudflared") | nindent 14 }}
      containers:
        - name: cloudflared
          image: {{ .Values.images.cloudflared }}
          args: ["tunnel", "--no-autoupdate", "--metrics", "0.0.0.0:2000", "run"]
          env:
            - { name: TUNNEL_TOKEN, valueFrom: { secretKeyRef: { name: {{ include "cp.name" . }}, key: tunnelToken } } }
          livenessProbe:
            httpGet: { path: /ready, port: 2000 }
            initialDelaySeconds: 20
            periodSeconds: 15
          resources:
            requests: { cpu: 50m, memory: 64Mi }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "cp.name" . }}-cloudflared
spec:
  minAvailable: 1
  selector:
    matchLabels: {{- include "cp.sel" (list $ "cloudflared") | nindent 6 }}
{{- end }}
