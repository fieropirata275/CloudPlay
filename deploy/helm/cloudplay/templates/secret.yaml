apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cp.name" . }}
  labels: {{- include "cp.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  jwtSecret: {{ include "cp.secret" (list . "jwtSecret" 48) | quote }}
  postgresPassword: {{ include "cp.secret" (list . "postgresPassword" 32) | quote }}
  joinToken: {{ include "cp.secret" (list . "joinToken" 40) | quote }}
  s3AccessKey: cloudplay
  s3SecretKey: {{ include "cp.secret" (list . "s3SecretKey" 32) | quote }}
  adminPassword: {{ .Values.admin.password | default (include "cp.secret" (list . "adminPassword" 16)) | quote }}
  turnSecret: {{ .Values.turn.coturnSecret | default (include "cp.secret" (list . "turnSecret" 32)) | quote }}
  cfTurnApiToken: {{ .Values.turn.cloudflareApiToken | quote }}
  tunnelToken: {{ .Values.cloudflared.token | quote }}
